<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <meta name="description" content="ブラウザーで使えるシンプルなリアルタイム文字起こしアプリです。">
    <title>Browser Transcription</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="intro">
        <p class="eyebrow">BROWSER TRANSCRIPTION</p>
        <h1>音声を文字に</h1>
        <p class="description">マイクに話した言葉を、その場でテキストにします。</p>
      </header>

      <section class="panel" aria-labelledby="transcription-heading">
        <div class="controls">
          <label class="language-control" for="language">
            <span>認識する言語</span>
            <select id="language">
              <option value="ja-JP" selected>日本語</option>
              <option value="en-US">English (US)</option>
              <option value="en-GB">English (UK)</option>
              <option value="ko-KR">한국어</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="fr-FR">Français</option>
              <option value="de-DE">Deutsch</option>
              <option value="es-ES">Español</option>
            </select>
          </label>
          <div class="record-controls">
            <button id="start" class="button button-primary" type="button">文字起こしを開始</button>
            <button id="stop" class="button button-secondary" type="button" disabled>停止</button>
          </div>
        </div>

        <div class="status-row">
          <span id="status-indicator" class="status-indicator" aria-hidden="true"></span>
          <p id="status" role="status" aria-live="polite">開始すると、ここに認識状態が表示されます。</p>
        </div>

        <label class="transcript-label" id="transcription-heading" for="transcript">文字起こし結果</label>
        <textarea id="transcript" placeholder="文字起こししたテキストがここに表示されます。" readonly></textarea>

        <div class="transcript-actions">
          <button id="copy" class="text-button" type="button">テキストをコピー</button>
          <button id="download" class="text-button" type="button">テキストをダウンロード</button>
          <button id="clear" class="text-button text-button-muted" type="button">クリア</button>
        </div>
      </section>

      <aside class="notice">
        <strong>音声認識について</strong>
        <p>このアプリはブラウザーの音声認識機能を使います。音声がブラウザー提供元のサービスに送信される場合があります。マイクを使うには、対応ブラウザーとインターネット接続が必要です。</p>
      </aside>
    </main>
  </body>
</html>
